server:
  port: 8080

spring:
  application:
    name: produto-api
  datasource:
    url: jdbc:postgresql://localhost:5432/produtodb
    username: produto
    password: produto123
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.exemplo.produtoapi: DEBUG
