version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: produto-api-db
    environment:
      POSTGRES_DB: produtodb
      POSTGRES_USER: produto
      POSTGRES_PASSWORD: produto123
    ports:
      - "5432:5432"
    volumes:
      - produto_db_data:/var/lib/postgresql/data

volumes:
  produto_db_data:
